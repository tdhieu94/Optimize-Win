name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Every build gets its own version; builds of main are published as releases for the in-app updater.
  OW_VERSION: 0.5.${{ github.run_number }}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test safety layer
        run: dotnet test tests/OW.Core.Tests/OW.Core.Tests.csproj -c Release

      - name: Publish service
        run: dotnet publish src/OW.Service/OW.Service.csproj -c Release -r win-x64 --self-contained -p:Version=${{ env.OW_VERSION }} -o out/OptimizeWin/Service

      - name: Publish app
        run: dotnet publish src/OW.App/OW.App.csproj -c Release -r win-x64 --self-contained -p:Platform=x64 -p:Version=${{ env.OW_VERSION }} -o out/OptimizeWin

      - name: Add install scripts
        shell: pwsh
        run: |
          Copy-Item scripts/install.ps1, scripts/uninstall.ps1, scripts/update.ps1, scripts/Cai-dat.cmd, scripts/Go-cai-dat.cmd out/OptimizeWin/
          if (-not (Test-Path out/OptimizeWin/OptimizeWin.exe)) { throw 'OptimizeWin.exe missing' }
          Get-ChildItem out/OptimizeWin -Filter *.pri | Format-Table Name, Length
          if (-not (Get-ChildItem out/OptimizeWin -Filter *.pri)) { throw 'No .pri resource file in the app output; XAML pages would not load' }
          if (-not (Test-Path out/OptimizeWin/Service/OptimizeWin.Service.exe)) { throw 'service exe missing' }

      - name: Smoke test - install like Hieu does, then open the app
        shell: pwsh
        run: |
          & out/OptimizeWin/install.ps1 -Quiet
          $installed = Get-Content (Join-Path $env:ProgramFiles 'OptimizeWin\installed.txt')
          Write-Host "Installed version: $installed"
          if ($installed -ne $env:OW_VERSION) { throw "installed.txt says '$installed', expected $env:OW_VERSION" }
          $svc = Get-Service OptimizeWinService
          Write-Host "Service status: $($svc.Status)"
          if ($svc.Status -ne 'Running') { throw 'OptimizeWinService is not running after install' }

          Write-Host 'Service self-test (read-only disk check):'
          & (Join-Path $env:ProgramFiles 'OptimizeWin\Service\OptimizeWin.Service.exe') --self-test
          if ($LASTEXITCODE -ne 0) { throw "Service self-test failed with exit code $LASTEXITCODE" }

          $start = Get-Date
          $exe = Join-Path $env:ProgramFiles 'OptimizeWin\OptimizeWin.exe'
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 20
          $p.Refresh()
          $crash = Join-Path $env:LOCALAPPDATA 'OptimizeWin\crash.log'
          $hadCrash = Test-Path $crash
          if ($hadCrash) { Get-Content $crash }
          if ($p.HasExited) {
            Write-Host "App exited with code $($p.ExitCode)"
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $start } -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in '.NET Runtime', 'Application Error', 'Windows Error Reporting' } |
              Format-List TimeCreated, ProviderName, Id, Message
            throw 'OptimizeWin.exe closed by itself during start-up'
          }
          # Screenshot for reviewing the UI (best effort; never fails the build).
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            New-Item -ItemType Directory -Force out/screenshots | Out-Null
            $bmp.Save("out/screenshots/main-window.png")
            Write-Host "Saved screenshot $($b.Width)x$($b.Height)"
          } catch { Write-Host "Screenshot skipped: $_" }
          Stop-Process -Id $p.Id -Force
          # An error dialog keeps the process alive, so a crash log also counts as a failure.
          if ($hadCrash) { throw 'The main window reported an error (see crash.log above)' }
          Write-Host 'Main window is still running after 20 seconds with no errors'

      - name: Smoke test - background check (scheduled task, notification, no repeat)
        shell: pwsh
        run: |
          $task = Get-ScheduledTask -TaskName 'OptimizeWin Health Check' -ErrorAction SilentlyContinue
          if (-not $task) { throw 'Scheduled task "OptimizeWin Health Check" was not registered' }
          Write-Host "Task: $($task.Actions[0].Execute) $($task.Actions[0].Arguments); triggers: $($task.Triggers.Count)"
          $dir = Join-Path $env:LOCALAPPDATA 'OptimizeWin'
          Remove-Item (Join-Path $dir 'crash.log'), (Join-Path $dir 'check.log'), (Join-Path $dir 'alerts.json') -ErrorAction SilentlyContinue
          $exe = Join-Path $env:ProgramFiles 'OptimizeWin\OptimizeWin.exe'
          $env:OW_TEST_ALERT = '1'
          foreach ($run in 1, 2) {
            $p = Start-Process -FilePath $exe -ArgumentList '--check' -WorkingDirectory (Split-Path $exe) -PassThru
            if (-not $p.WaitForExit(60000)) {
              $last = (Get-Content (Join-Path $dir 'check.log') -ErrorAction SilentlyContinue | Select-Object -Last 1)
              Stop-Process -Id $p.Id -Force
              # Windows Server runners may not support app notifications; then OW opens its window instead (by design).
              if ($run -eq 1 -and $last -match 'opening the window') {
                Write-Host '::warning::Notifications are not available on this runner; --check opened the window instead (expected fallback).'
                continue
              }
              Get-Content (Join-Path $dir 'check.log') -ErrorAction SilentlyContinue
              throw "--check run $run did not finish within 60 seconds"
            }
            Write-Host "--check run $run exited with code $($p.ExitCode)"
          }
          $log = Get-Content (Join-Path $dir 'check.log')
          $log
          if (Test-Path (Join-Path $dir 'crash.log')) { Get-Content (Join-Path $dir 'crash.log'); throw '--check reported an error' }
          if (-not ($log -match 'Notification shown|opening the window')) { throw 'The test alert was neither notified nor shown in the window' }
          if (-not ($log[-1] -match ', 0 to announce')) { throw 'The second check announced the same alert again' }

      - name: Windows component store - analysis and real cleanup (throw-away runner)
        shell: pwsh
        timeout-minutes: 40
        run: |
          & (Join-Path $env:ProgramFiles 'OptimizeWin\Service\OptimizeWin.Service.exe') --component-cleanup-ci
          if ($LASTEXITCODE -ne 0) { throw "Component cleanup check failed with exit code $LASTEXITCODE" }

      - name: Space scan timing (read-only, C:\Windows, as SYSTEM-like admin)
        shell: pwsh
        timeout-minutes: 10
        run: |
          & (Join-Path $env:ProgramFiles 'OptimizeWin\Service\OptimizeWin.Service.exe') --scan-timing 'C:\Windows'
          if ($LASTEXITCODE -ne 0) { throw "Space scan timing failed with exit code $LASTEXITCODE" }

      - name: Smoke test - updater script (backup, reinstall, service back up)
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'ow-update.log'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File out/OptimizeWin/update.ps1 -Backup (Join-Path $env:RUNNER_TEMP 'ow-backup') -Log $log -Version $env:OW_VERSION
          Get-Content $log
          if ($LASTEXITCODE -ne 0) { throw "update.ps1 exited with $LASTEXITCODE" }
          if (-not (Select-String -Path $log -Pattern 'Cập nhật xong' -Quiet)) { throw 'update.ps1 did not finish' }
          if ((Get-Service OptimizeWinService).Status -ne 'Running') { throw 'Service not running after update.ps1' }
          if (-not (Test-Path (Join-Path $env:RUNNER_TEMP 'ow-backup\Service\OptimizeWin.Service.exe'))) { throw 'No backup made' }

      - name: Smoke test - fallback window
        shell: pwsh
        run: |
          $env:OW_TEST_FALLBACK = '1'
          Remove-Item (Join-Path $env:LOCALAPPDATA 'OptimizeWin\crash.log') -ErrorAction SilentlyContinue
          $exe = Join-Path $env:ProgramFiles 'OptimizeWin\OptimizeWin.exe'
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 20
          $p.Refresh()
          $crash = Join-Path $env:LOCALAPPDATA 'OptimizeWin\crash.log'
          if (Test-Path $crash) { Get-Content $crash }
          if ($p.HasExited) { throw "Fallback window closed by itself (exit code $($p.ExitCode))" }
          Write-Host 'Fallback window is still running after 20 seconds'
          Stop-Process -Id $p.Id -Force

      - name: Publish release for the in-app updater (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "OptimizeWin-$env:OW_VERSION.zip"
          Compress-Archive -Path out/OptimizeWin/* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$zip.sha256" -Value "$hash  $zip" -Encoding ASCII -NoNewline
          $notes = git log -1 --format=%B
          gh release create "v$env:OW_VERSION" $zip "$zip.sha256" --title "Optimize Win $env:OW_VERSION" --notes "$notes" --target $env:GITHUB_SHA
          Write-Host "Released v$env:OW_VERSION ($hash)"

      - uses: actions/upload-artifact@v4
        with:
          name: OptimizeWin-${{ github.sha }}
          path: out/OptimizeWin
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ github.sha }}
          path: out/screenshots
          if-no-files-found: ignore
          retention-days: 7
